<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор примогемов — сколько нужно в день</title>
<style>
  :root{
    --bg:#0d1017;
    --card:#161a24;
    --card2:#1d2230;
    --line:#2a3143;
    --text:#e8ecf5;
    --muted:#8d97ad;
    --gold:#f0c97a;
    --gold2:#d9a544;
    --teal:#5fd8c4;
    --red:#ff7b7b;
    --green:#6fdb8e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1000px 500px at 12% -10%, rgba(240,201,122,.10), transparent 60%),
      radial-gradient(900px 500px at 95% 0%, rgba(95,216,196,.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    padding:22px 16px 60px;
  }
  .wrap{max-width:940px;margin:0 auto}

  header{text-align:center;margin-bottom:22px}
  h1{
    font-size:clamp(21px,4.4vw,30px);
    margin:0 0 6px;
    letter-spacing:.2px;
    background:linear-gradient(92deg,var(--gold),#fff2d0 55%,var(--teal));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{margin:0;color:var(--muted);font-size:14px}

  .card{
    background:linear-gradient(180deg,var(--card),var(--card2));
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 12px 30px rgba(0,0,0,.28);
  }

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}
  .field{min-width:0;display:flex;flex-direction:column}
  .field .chips{margin-top:9px}
  label{display:block;font-size:13px;color:var(--muted);font-weight:600}
  label .hint{font-weight:400;opacity:.75}
  input[type=date],input[type=number]{
    width:100%;margin-top:6px;padding:11px 12px;
    background:#0e121b;border:1px solid var(--line);border-radius:10px;
    color:var(--text);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;
    outline:none;transition:border-color .15s, box-shadow .15s;
    font-family:inherit;
  }
  input:focus{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(240,201,122,.14)}
  input[type=date]{color-scheme:dark}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
  .chips button{
    background:#232a3a;border:1px solid var(--line);color:#cfd6e6;
    padding:7px 11px;border-radius:999px;font-size:12.5px;font-weight:600;
    cursor:pointer;font-family:inherit;transition:.15s;
  }
  .chips button:hover{background:#2c3547;border-color:#3b4560;color:#fff}
  .chips button.on{background:rgba(240,201,122,.16);border-color:var(--gold2);color:var(--gold)}

  /* Итоговая карточка */
  .hero{
    display:grid;grid-template-columns:1.05fr 1fr;gap:16px;align-items:center;
  }
  @media(max-width:720px){.hero{grid-template-columns:1fr}}
  .hero-main{
    background:radial-gradient(400px 200px at 0% 0%,rgba(240,201,122,.14),transparent 70%);
    border:1px solid var(--line);border-radius:14px;padding:16px;
  }
  .hero-label{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
  .big{font-size:clamp(32px,8vw,46px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0 2px;color:var(--gold)}
  .big .unit{font-size:15px;font-weight:600;color:var(--muted);margin-left:6px}
  .alt{font-size:15px;color:#c8d0e2}
  .alt b{color:var(--teal);font-variant-numeric:tabular-nums}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{background:#12161f;border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  .stat .k{font-size:12px;color:var(--muted);font-weight:600}
  .stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px}
  .stat .v small{font-size:12px;font-weight:600;color:var(--muted)}

  .bar{height:10px;background:#0e121b;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:14px}
  .bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold2),var(--gold),var(--teal));transition:width .35s ease}
  .bar-info{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  tr:last-child td{border-bottom:none}

  h2{font-size:16px;margin:0 0 10px;color:#dfe6f3}
  h2 .tag{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
  .note{font-size:12.5px;color:var(--muted);margin-top:10px}
  .warnbox{border-color:rgba(255,123,123,.5);background:rgba(255,123,123,.08)}
  .err{color:var(--red);font-weight:700;font-size:14px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>💰 Калькулятор примогемов до цели</h1>
    <p class="sub">Сколько нужно зарабатывать в день, чтобы набрать нужное число круток к нужной дате</p>
  </header>

  <section class="card">
    <div class="grid">
      <div class="field">
        <label>Дата цели
          <input type="date" id="targetDate">
        </label>
        <div class="chips">
          <button data-days="7">через неделю</button>
          <button data-days="14">2 недели</button>
          <button data-days="30">месяц</button>
          <button data-days="42">патч (42 дня)</button>
          <button data-days="90">3 месяца</button>
        </div>
      </div>

      <div class="field">
        <label>Хочу иметь круток <span class="hint">(цель)</span>
          <input type="number" id="targetWishes" min="0" step="1" value="180" inputmode="numeric">
        </label>
        <div class="chips">
          <button data-wishes="180">180</button>
          <button data-wishes="360">360</button>
          <button data-wishes="540">540</button>
          <button data-wishes="720">720</button>
          <button data-wishes="900">900</button>
          <button data-wishes="1080">1080</button>
          <button data-wishes="1260">1260</button>
        </div>
      </div>
    </div>

    <div class="grid" style="margin-top:14px">
      <div class="field">
        <label>Есть круток сейчас <span class="hint">(судьбы)</span>
          <input type="number" id="haveWishes" min="0" step="1" value="0" inputmode="numeric">
        </label>
      </div>
      <div class="field">
        <label>Есть примогемов сейчас
          <input type="number" id="havePrimos" min="0" step="1" value="0" inputmode="numeric">
        </label>
      </div>
    </div>

    <p class="note">Расчёт: 1 крутка (Переплетённая судьба) = 160 примогемов.</p>
  </section>

  <div id="out"></div>

</div>

<script>
(function(){
  var WISH = 160; // примогемов за 1 крутку

  var els = {
    date:    document.getElementById('targetDate'),
    target:  document.getElementById('targetWishes'),
    haveW:   document.getElementById('haveWishes'),
    haveP:   document.getElementById('havePrimos'),
    out:     document.getElementById('out')
  };

  function num(el){ var v = parseFloat(String(el.value).replace(',', '.')); return isFinite(v) && v > 0 ? v : 0; }
  function fmt(n){ return Math.round(n).toLocaleString('ru-RU'); }
  function fmt1(n){ return n.toLocaleString('ru-RU', {minimumFractionDigits:1, maximumFractionDigits:1}); }
  function fmt2(n){ return n.toLocaleString('ru-RU', {minimumFractionDigits:2, maximumFractionDigits:2}); }
  function up(n){ return Math.ceil(n - 1e-9); }

  // Склонения
  function plural(n, one, few, many){
    n = Math.abs(Math.round(n)) % 100;
    var n1 = n % 10;
    if (n > 10 && n < 20) return many;
    if (n1 === 1) return one;
    if (n1 >= 2 && n1 <= 4) return few;
    return many;
  }
  function days(n){ return plural(n,'день','дня','дней'); }
  function wishes(n){ return plural(n,'крутка','крутки','круток'); }
  function months(n){ return plural(n,'месяц','месяца','месяцев'); }

  function todayMidnight(){
    var d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function isoLocal(d){
    var m = ('0' + (d.getMonth() + 1)).slice(-2), day = ('0' + d.getDate()).slice(-2);
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function formatDate(d){
    try{
      return d.toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});
    }catch(e){ return isoLocal(d); }
  }

  // ---- подсветка активных чипсов
  function syncChips(){
    var today = todayMidnight();
    var parts = (els.date.value || '').split('-'), diff = null;
    if (parts.length === 3){
      var d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
      if (!isNaN(d.getTime())) diff = Math.round((d - today) / 86400000);
    }
    document.querySelectorAll('.chips button[data-days]').forEach(function(b){
      b.classList.toggle('on', diff !== null && diff === parseInt(b.dataset.days, 10));
    });
    var goal = num(els.target);
    document.querySelectorAll('.chips button[data-wishes]').forEach(function(b){
      b.classList.toggle('on', goal > 0 && goal === parseFloat(b.dataset.wishes));
    });
  }

  // ---- инициализация даты: +42 дня от сегодня
  function setDatePlus(daysFromNow){
    var t = todayMidnight();
    t.setDate(t.getDate() + daysFromNow);
    els.date.value = isoLocal(t);
    render();
  }

  function render(){
    var haveW = num(els.haveW), haveP = num(els.haveP), goal = num(els.target);
    var totalNow = haveW * WISH + haveP;
    syncChips();

    // дата
    var parts = (els.date.value || '').split('-');
    var dateValid = parts.length === 3;
    var target = null;
    if (dateValid){
      target = new Date(+parts[0], +parts[1] - 1, +parts[2]);
      if (isNaN(target.getTime())) { target = null; dateValid = false; }
    }

    if (!dateValid){
      els.out.innerHTML = '<section class="card warnbox"><p class="err">⚠ Укажите дату цели — без неё расчёт невозможен.</p></section>';
      return;
    }

    var diffMs = target - todayMidnight();
    var rawDays = Math.round(diffMs / 86400000);
    var daysLeft = Math.max(rawDays, 1);

    var needTotal = goal * WISH;
    var missing = Math.max(0, needTotal - totalNow);
    var perDay = missing / daysLeft;          // точное значение
    var perDayReq = up(perDay);               // сколько нужно «хотя бы» — округляем вверх
    var perWishDay = perDay / WISH;

    var progress = needTotal > 0 ? Math.min(100, totalNow / needTotal * 100) : 100;
    var primosNow = Math.floor(totalNow / WISH);

    var html = '';

    // ---- предупреждения
    if (rawDays < 0){
      html += '<section class="card warnbox"><p class="err">⚠ Дата цели уже в прошлом (' + formatDate(target) + '). Укажите будущую дату.</p></section>';
    } else if (rawDays === 0){
      html += '<section class="card warnbox"><p class="err">⚠ Дата цели — сегодня. Считать «в день» нечего, поэтому расчёт сделан как для 1 дня.</p></section>';
    } else if (rawDays === 1){
      html += '<section class="card warnbox"><p class="err">⏳ До цели остался 1 день — успеть почти нереально, но цифры посчитаны.</p></section>';
    }

    if (goal <= 0){
      els.out.innerHTML = html + '<section class="card"><p class="err">Укажите, сколько круток вы хотите иметь (цель больше 0).</p></section>';
      return;
    }

    // ---- цель уже достигнута
    if (missing <= 0){
      var extra = Math.floor((totalNow - needTotal) / WISH);
      els.out.innerHTML = html +
        '<section class="card"><div class="hero-main" style="border-color:rgba(111,219,142,.4)">' +
          '<div class="hero-label">Цель уже достигнута</div>' +
          '<div class="big" style="color:var(--green)">' + fmt(primosNow) + '<span class="unit">' + wishes(primosNow) + ' есть на руках</span></div>' +
          '<div class="alt">К ' + formatDate(target) + ' ничего зарабатывать не нужно. Запас: <b>' + fmt(extra) + '</b> ' + wishes(extra) + ' сверх цели.</div>' +
        '</div></section>';
      return;
    }

    // ---- главный блок
    html += '<section class="card"><div class="hero">' +
      '<div class="hero-main">' +
        '<div class="hero-label">Нужно зарабатывать</div>' +
        '<div class="big">' + fmt(perDayReq) + '<span class="unit">примогемов / день</span></div>' +
        '<div class="alt">Это <b>' + fmt2(perWishDay) + '</b> ' + wishes(perWishDay) + ' в день' +
          (perWishDay < 1 ? ' (то есть 1 крутка примерно за ' + fmt1(1 / perWishDay) + ' ' + days(1 / perWishDay) + ')' : '') + '</div>' +
        '<div class="alt" style="margin-top:6px">≈ <b>' + fmt(perDayReq * 7) + '</b> примогемов в неделю · <b>' + fmt(perDayReq * 30) + '</b> в месяц</div>' +
      '</div>' +
      '<div class="stats">' +
        '<div class="stat"><div class="k">До цели</div><div class="v">' + fmt(Math.max(rawDays, 0)) + ' <small>' + days(Math.max(rawDays, 0)) + (rawDays < 0 ? ' (дата прошла)' : '') + '</small></div></div>' +
        '<div class="stat"><div class="k">Дата цели</div><div class="v" style="font-size:15px">' + formatDate(target) + '</div></div>' +
        '<div class="stat"><div class="k">Не хватает</div><div class="v">' + fmt(missing / WISH) + ' <small>' + wishes(missing / WISH) + '</small></div></div>' +
        '<div class="stat"><div class="k">Не хватает примогемов</div><div class="v">' + fmt(missing) + '</div></div>' +
        '<div class="stat"><div class="k">Есть сейчас</div><div class="v">' + fmt(primosNow) + ' <small>' + wishes(primosNow) + '</small></div></div>' +
        '<div class="stat"><div class="k">Цель</div><div class="v">' + fmt(goal) + ' <small>' + wishes(goal) + '</small></div></div>' +
      '</div></div>' +

      '<div class="bar"><i style="width:' + progress.toFixed(2) + '%"></i></div>' +
      '<div class="bar-info"><span>Прогресс: ' + fmt(primosNow) + ' из ' + fmt(goal) + ' ' + wishes(goal) + '</span><span>' + progress.toFixed(1).replace('.', ',') + '%</span></div>' +

    '</section>';

    els.out.innerHTML = html;
  }

  // ---- обработчики
  ['input','change'].forEach(function(ev){
    els.date.addEventListener(ev, render);
    [els.target, els.haveW, els.haveP].forEach(function(el){
      el.addEventListener(ev, render);
      el.addEventListener('blur', function(){
        if (el.value !== '') { el.value = Math.max(0, Math.round(num(el))); }
        render();
      });
    });
  });

  document.querySelectorAll('.chips button').forEach(function(btn){
    btn.addEventListener('click', function(){
      if (btn.dataset.days){
        setDatePlus(parseInt(btn.dataset.days, 10));
      } else if (btn.dataset.wishes){
        els.target.value = btn.dataset.wishes;
        render();
      }
    });
  });

  // старт
  setDatePlus(42);
})();
</script>
