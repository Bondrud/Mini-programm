name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Тесты (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Запуск тестов
        run: npm test
