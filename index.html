<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор круток — Genshin · Endfield · NTE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="g-genshin">
<div class="wrap">

  <header>
    <h1>💰 Калькулятор круток до цели</h1>
    <p class="sub">Сколько нужно зарабатывать в день, чтобы набрать нужное число круток к нужной дате</p>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab on" data-game="genshin">Genshin Impact</button>
    <button class="tab" data-game="endfield">Arknights: Endfield</button>
    <button class="tab" data-game="nte">NTE</button>
  </nav>

  <section class="card">
    <div class="grid">
      <div class="field">
        <label>Дата цели
          <input type="date" id="targetDate">
        </label>
        <div class="chips" id="dateChips">
          <button data-days="7">через неделю</button>
          <button data-days="14">2 недели</button>
          <button data-days="30">месяц</button>
          <button data-days="42">патч (42 дня)</button>
          <button data-days="90">3 месяца</button>
        </div>
      </div>

      <div class="field">
        <label>Хочу иметь круток <span class="hint">(цель)</span>
          <input type="number" id="targetWishes" min="0" step="1" inputmode="numeric">
        </label>
        <div class="chips" id="wishChips"></div>
      </div>
    </div>

    <div class="grid" style="margin-top:14px">
      <div class="field">
        <label>Есть круток сейчас <span class="hint" id="lblHaveWHint">(судьбы)</span>
          <input type="number" id="haveWishes" min="0" step="1" value="0" inputmode="numeric">
        </label>
      </div>
      <div class="field">
        <label><span id="lblHaveP">Есть примогемов сейчас</span>
          <input type="number" id="havePrimos" min="0" step="1" value="0" inputmode="numeric">
        </label>
      </div>
    </div>

    <div class="footrow">
      <p class="note" id="noteLine">Расчёт: 1 крутка (Переплетённая судьба) = 160 примогемов.</p>
      <button class="reset" id="resetBtn">⟲ Сбросить вкладку</button>
    </div>
  </section>

  <div id="out"></div>

</div>

<script src="js/utils.js"></script>
<script src="js/games.js"></script>
<script src="js/store.js"></script>
<script src="js/calc.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
